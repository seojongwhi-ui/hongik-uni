<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 연구의 출발점</text>
<text x="88" y="143.32" font-family="Noto Sans KR" font-size="48" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">연구의 핵심 질문</text>
<text x="88" y="210.43" font-family="Noto Sans KR" font-size="27" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">동승자와 함께 있을 때 나타나는 감정 조절의 이유에 주목한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="862.89" font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">02</text>
<text x="88" y="372.13" font-family="Noto Sans KR" font-size="57" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">왜 동승자가 있으면</text>
<text x="88" y="456.49" font-family="Noto Sans KR" font-size="57" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">화를 표현하는 방식이 달라질까?</text>
<text x="88" y="568.15" font-family="Noto Sans KR" font-size="35" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">예비조사에서는 ‘동승자의 안전에 대한 책임감’이</text>
<text x="88" y="619.9499999999999" font-family="Noto Sans KR" font-size="35" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">가장 많이 선택된 영향 이유였다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="753.25" font-family="Noto Sans KR" font-size="25" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">연구 방향</text>
<text x="290" y="752.43" font-family="Noto Sans KR" font-size="27" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">이 경험을 차량 AI의 자기조절 지원 방식으로 연결한다.</text></svg>