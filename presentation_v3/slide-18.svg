<text x="422" y="412.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">예비 문항 보완, 표본과 연령대 확대, 동승 관계와 영향 이유 조사</text>
