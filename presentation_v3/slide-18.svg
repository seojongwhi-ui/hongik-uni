<text x="88" y="610.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 제작</text>
<text x="422" y="610.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">세 가지 AI 모델과 상황별 인터랙션 시나리오 구현</text>
