<text x="88" y="143.32" font-family="Noto Sans KR" font-size="48" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">문헌과 경험 자료를 설계·평가로 연결</text>
<text x="88" y="210.43" font-family="Noto Sans KR" font-size="27" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">표본 수와 구체적인 실험 방식은 교수님 피드백을 반영해 확정한다.</text>
