<text x="88" y="313.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 문헌연구</text>
<text x="422" y="313.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">운전 분노 척도, 감정 조절, 동승자 효과, 타자·책임, 차량 AI 검토</text>
