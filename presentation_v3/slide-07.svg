<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">02 · 인문학적 해석</text>
<text x="88" y="143.32" font-family="Noto Sans KR" font-size="48" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자를 어떻게 이해할 것인가</text>
<text x="88" y="210.43" font-family="Noto Sans KR" font-size="27" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">‘타자와 책임’은 본 연구에서 탐색할 해석적 관점이다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="862.89" font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">07</text>
<text x="88" y="328.07" font-family="Noto Sans KR" font-size="23" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01</text>
<text x="88" y="402.06" font-family="Noto Sans KR" font-size="34" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">시선의 타자</text>
<rect x="88" y="481" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="88" y="537.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">누군가 나를 보고 있다는</text>
<text x="88" y="578.96" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">인식이 평가, 체면과</text>
<text x="88" y="620.4" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">연결되는 경험</text>
<text x="581.3333333333333" y="328.07" font-family="Noto Sans KR" font-size="23" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">02</text>
<text x="581.3333333333333" y="402.06" font-family="Noto Sans KR" font-size="34" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">관계의 타자</text>
<rect x="581.3333333333333" y="481" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="581.3333333333333" y="537.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">혼자 있던 실내가</text>
<text x="581.3333333333333" y="578.96" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">누군가와 함께하는</text>
<text x="581.3333333333333" y="620.4" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">공간으로 바뀌는 경험</text>
<text x="1074.6666666666665" y="328.07" font-family="Noto Sans KR" font-size="23" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03</text>
<text x="1074.6666666666665" y="402.06" font-family="Noto Sans KR" font-size="34" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">책임의 타자</text>
<rect x="1074.6666666666665" y="481" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="1074.6666666666665" y="537.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">함께 탄 사람의 안전을</text>
<text x="1074.6666666666665" y="578.96" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">내가 책임져야 한다고</text>
<text x="1074.6666666666665" y="620.4" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">느끼는 경험</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="753.25" font-family="Noto Sans KR" font-size="25" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">후속 과제</text>
<text x="290" y="752.43" font-family="Noto Sans KR" font-size="27" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">이 관점을 뒷받침할 인문학 문헌과 실제 경험 자료를 보완한다.</text></svg>