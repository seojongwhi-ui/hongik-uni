<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 문제와 목적</text>
<text x="88" y="143.32" font-family="Noto Sans KR" font-size="48" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">이 연구가 해결하려는 문제</text>
<text x="88" y="210.43" font-family="Noto Sans KR" font-size="27" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">운전자의 감정 경험을 차량 내 AI 인터페이스 설계로 연결한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="862.89" font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">04</text>
<text x="88" y="325.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">관찰할 현상</text>
<text x="422" y="325.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있을 때 감정 표현과 행동을 조절하는 경험</text>
<rect x="88" y="373" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="416.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">설명할 이유</text>
<text x="422" y="416.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">시선·체면 의식과 안전 책임감이 각각 작동하는 방식</text>
<rect x="88" y="464" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="507.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">설계할 대상</text>
<text x="422" y="507.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">운전자가 스스로 감정을 조절하도록 돕는 차량 AI</text>
<rect x="88" y="555" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="598.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인할 효과</text>
<text x="422" y="598.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">책임감 환기, 분노 경험, 방해감, 신뢰와 수용성</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="753.25" font-family="Noto Sans KR" font-size="25" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">연구 목적</text>
<text x="290" y="752.43" font-family="Noto Sans KR" font-size="27" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자 경험의 해석을 AI 인터랙션 설계 원칙으로 구체화한다.</text></svg>