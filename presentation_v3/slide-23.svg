<text x="422" y="610.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">추가할 문항, 표본 조건, 책임감과 분노 조절의 측정 방식은 무엇인가?</text>
