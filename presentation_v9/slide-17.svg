<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 개인심리학</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">정서표현갈등과 개인차</text>
<text x="88" y="219.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">윤보영·이순철(2011)은 익명상황 민감군의 정서표현갈등과 난폭운전 가능성을 연결해 설명한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: 윤보영·이순철, 익명상황의 운전행동과 운전분노 및 정서표현갈등과의 관계, 2011</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">17</text>
<text x="88" y="308.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">연구 문제</text>
<text x="422" y="308.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">익명성과 평가 불안 해제 상황에서도 왜 특정 개인만 강한 탈억제 행동이나 난폭 행동을 보이는가?</text>
<rect x="88" y="371" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="410.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">핵심 변인</text>
<text x="422" y="410.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">정서표현갈등은 정서를 표현하고 싶지만 억제하면서 생기는 내적 갈등이다. 자기방어적 양가성은 상처받을</text>
<text x="422" y="445.68" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">두려움 때문에 감정을 억누르는 성향을 뜻한다.</text>
<rect x="88" y="473" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="512.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">실증 결과</text>
<text x="422" y="512.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">익명상황에 민감한 난폭운전·일탈 유발 집단은 평소 정서표현갈등, 특히 자기방어적 양가성 수준이 유의미하게</text>
<text x="422" y="547.68" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">높게 나타났다.</text>
<rect x="88" y="575" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="614.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">연구 적용</text>
<text x="422" y="614.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">평가 불안이 낮아진 운전 환경은 억제된 감정을 가진 개인에게 분노 표현이 강화되는 심리적 계기가 될 수 있다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">적용 지점</text>
<text x="356" y="755.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자는 억제된 정서의 표출을 다시 조절하게 하는 외적 단서다.</text></svg>