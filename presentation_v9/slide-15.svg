<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 인문학</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">자아 연출 이론: 무대와 시선</text>
<text x="88" y="219.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">Goffman(1959)은 사회적 상호작용을 무대 위 수행으로 설명한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: Goffman, The Presentation of Self in Everyday Life, 1959</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">15</text>
<text x="88" y="320.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">핵심 개념</text>
<text x="422" y="320.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">인간은 타인의 시선이 있는 곳에서 자신의 인상을 관리하고, 사회적으로 적절한 모습을 연출한다.</text>
<rect x="88" y="377" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="416.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">전면 영역</text>
<text x="422" y="416.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인의 시선과 사회적 규범이 존재하는 공간이다. 개인은 페르소나를 착용하고 인상 관리와 행동 통제를</text>
<text x="422" y="451.68" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">수행한다.</text>
<rect x="88" y="473" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="512.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">후면 영역</text>
<text x="422" y="512.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인의 시선과 식별성이 약화된 공간이다. 연출이 느슨해지고 억제된 자아나 감정 표현이 나타날 수 있다.</text>
<rect x="88" y="569" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="608.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">연구 적용</text>
<text x="422" y="608.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">혼자 운전하는 차량 내부는 공적 도로 위에 있지만, 운전자가 체감하는 맥락에서는 후면 영역의 성격을 가질 수</text>
<text x="422" y="643.68" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">있다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">적용 지점</text>
<text x="356" y="755.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자는 차량 내부를 전면 영역에 가깝게 만드는 단서가 될 수 있다.</text></svg>