<text x="290" y="752.43" font-family="Noto Sans KR" font-size="27" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자는 감시하는 시선보다, 내가 보호해야 할 사람으로 경험될 가능성이 크다.</text></svg>