<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 출발점</text>
<text x="88" y="143.32" font-family="Noto Sans KR" font-size="48" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">연구자의 일상적 관찰에서 시작</text>
<text x="88" y="210.43" font-family="Noto Sans KR" font-size="27" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">혼자 운전할 때와 누군가 함께 탈 때의 감정 표현 차이에 주목했다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="862.89" font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">02</text>
<text x="88" y="342.68" font-family="Noto Sans KR" font-size="52" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">나는 운전 중 쉽게 화가 나지만,</text>
<text x="88" y="419.64" font-family="Noto Sans KR" font-size="52" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">가족이나 다른 사람이 타면</text>
<text x="88" y="496.59999999999997" font-family="Noto Sans KR" font-size="52" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">그 화를 덜 내는 내 모습을 발견했다.</text>
<text x="88" y="602.7" font-family="Noto Sans KR" font-size="30" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">원래라면 경적, 욕설, 혼잣말로 반응했을 상황에서도</text>
<text x="88" y="647.1" font-family="Noto Sans KR" font-size="30" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">동승자가 있으면 표현을 참거나 행동을 조절하게 된다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="753.25" font-family="Noto Sans KR" font-size="25" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">문제의식</text>
<text x="290" y="752.43" font-family="Noto Sans KR" font-size="27" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">이 변화가 나만의 경험인지, 다른 운전자에게도 나타나는지 확인하고자 했다.</text></svg>