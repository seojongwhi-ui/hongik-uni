<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03 · 원인 해석</text>
<text x="88" y="143.32" font-family="Noto Sans KR" font-size="48" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">왜 동승자는 분노 표현을 줄이게 하는가</text>
<text x="88" y="210.43" font-family="Noto Sans KR" font-size="27" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">설문 결과를 인문학적·심리적·사회적 관점으로 연결한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="862.89" font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">15</text>
<text x="88" y="328.07" font-family="Noto Sans KR" font-size="23" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01</text>
<text x="88" y="402.06" font-family="Noto Sans KR" font-size="34" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">인문학적 관점</text>
<rect x="88" y="481" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="88" y="537.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자는 단순한 관찰자가 아니라</text>
<text x="88" y="578.96" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">내 운전에 의존하는 타자다.</text>
<text x="88" y="620.4" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">분노보다 보호 책임이 앞선다.</text>
<text x="581.3333333333333" y="328.07" font-family="Noto Sans KR" font-size="23" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">02</text>
<text x="581.3333333333333" y="402.06" font-family="Noto Sans KR" font-size="34" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">심리적 관점</text>
<rect x="581.3333333333333" y="481" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="581.3333333333333" y="537.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">화나는 상황의 의미가</text>
<text x="581.3333333333333" y="578.96" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">“내가 당했다”에서</text>
<text x="581.3333333333333" y="620.4" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">“안전하게 도착해야 한다”로 바뀐다.</text>
<text x="1074.6666666666665" y="328.07" font-family="Noto Sans KR" font-size="23" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03</text>
<text x="1074.6666666666665" y="402.06" font-family="Noto Sans KR" font-size="34" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">사회적 관점</text>
<rect x="1074.6666666666665" y="481" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="1074.6666666666665" y="537.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">차 안의 역할이 개인 운전자에서</text>
<text x="1074.6666666666665" y="578.96" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">누군가를 데려다주는 사람으로</text>
<text x="1074.6666666666665" y="620.4" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">바뀐다.</text>
<text x="1074.6666666666665" y="661.8399999999999" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">관계에 따라 억제와 동조가 달라진다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="753.25" font-family="Noto Sans KR" font-size="25" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">해석의 범위</text>
<text x="290" y="752.43" font-family="Noto Sans KR" font-size="27" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">예비조사는 책임감이 빈번한 이유임을 보여주며, 원인 구조는 본조사에서 검증한다.</text></svg>