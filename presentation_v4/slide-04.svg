<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 조사 이유</text>
<text x="88" y="143.32" font-family="Noto Sans KR" font-size="48" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">먼저 사람들도 나처럼 경험하는지 확인했다</text>
<text x="88" y="210.43" font-family="Noto Sans KR" font-size="27" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">설문은 이론 검증보다 문제 발견과 방향 확인을 위한 예비조사로 진행했다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="862.89" font-family="Noto Sans KR" font-size="21" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">04</text>
<text x="88" y="312.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 1</text>
<text x="422" y="312.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">사람들도 운전 중 화가 나는가?</text>
<rect x="88" y="368" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="411.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 2</text>
<text x="422" y="411.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">어떤 상황에서 특히 화가 나는가?</text>
<rect x="88" y="467" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="510.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 3</text>
<text x="422" y="510.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">화가 났을 때 어떤 방식으로 반응하는가?</text>
<rect x="88" y="566" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="609.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 4</text>
<text x="422" y="609.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있으면 화가 줄어드는가, 아니면 같이 동조되어 더 커지는가?</text>
<rect x="88" y="665" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="708.52" font-family="Noto Sans KR" font-size="28" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 5</text>
<text x="422" y="708.52" font-family="Noto Sans KR" font-size="28" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">그 변화의 이유가 시선 의식인지, 안전 책임감인지 확인할 수 있는가?</text></svg>