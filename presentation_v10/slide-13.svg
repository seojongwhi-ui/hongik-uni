<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03 · 설문에서 얻은 시사점</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">설문 결과를 바탕으로 정한 연구 질문</text>
<text x="88" y="218.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">이번 33명의 응답을 바탕으로, 안전 책임감과 감정·행동 조절의 관계에 주목한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">13</text>
<text x="88" y="311.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">발견 1</text>
<text x="422" y="311.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">조사한 상황 중 타인의 경적·상향등·손짓에 대한 분노 평균이 가장 높았다.</text>
<rect x="88" y="369" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="407.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">발견 2</text>
<text x="422" y="407.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">혼잣말과 욕설의 평균 점수가 공격적 운전과 외부 불만 표현 행동보다 높았다.</text>
<rect x="88" y="465" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="503.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">발견 3</text>
<text x="422" y="503.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있을 때 표현을 조절하고 행동을 참는다는 응답 평균은 약 4점이었다.</text>
<rect x="88" y="561" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="599.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">발견 4</text>
<text x="422" y="599.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자의 영향을 받는 이유로 안전 책임감이 가장 많이 선택되었다(63.6%).</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">연구 질문</text>
<text x="356" y="754.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자의 안전을 지켜야 한다는 책임감은 운전자의 감정 표현과 행동 조절에 어떤 영향을 주는가?</text></svg>