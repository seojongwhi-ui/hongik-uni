<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 조사 이유</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자에 따른 변화를 설문으로 확인했다</text>
<text x="88" y="218.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">설문은 운전자의 경험을 파악하고 후속 연구 질문을 정하기 위한 예비조사로 진행했다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">05</text>
<text x="88" y="307.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 1</text>
<text x="422" y="307.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">운전자들은 운전 중 분노를 경험하는가?</text>
<rect x="88" y="368" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="406.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 2</text>
<text x="422" y="406.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">분노는 어떤 상황에서 특히 강하게 나타나는가?</text>
<rect x="88" y="467" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="505.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 3</text>
<text x="422" y="505.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">분노가 발생했을 때 어떤 방식으로 반응하는가?</text>
<rect x="88" y="566" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="604.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 4</text>
<text x="422" y="604.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있으면 감정 표현을 줄이는가, 오히려 더 강하게 표현하는가?</text>
<rect x="88" y="665" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="703.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 5</text>
<text x="422" y="703.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자의 영향을 받는 이유로 시선 의식과 안전 책임감 중 무엇을 선택하는가?</text></svg>