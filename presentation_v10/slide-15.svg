<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 인문·사회적 관점</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">자아 연출 이론: 타인 앞에서 달라지는 행동</text>
<text x="88" y="218.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">Goffman(1959)은 사람들이 타인에게 보이는 자신의 모습을 조절한다고 설명한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: Goffman, The Presentation of Self in Everyday Life, 1959 · 운전 상황 적용은 연구자 해석</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">15</text>
<text x="88" y="319.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">핵심 개념</text>
<text x="422" y="319.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">사람은 함께 있는 상대와 상황에 맞춰 자신의 말투, 표정, 행동을 조절한다.</text>
<rect x="88" y="377" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="415.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">전면 영역</text>
<text x="422" y="415.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">관객 앞의 무대처럼, 타인에게 보이고 싶은 모습에 맞춰 행동하는 상황이다.</text>
<rect x="88" y="473" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="511.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">후면 영역</text>
<text x="422" y="511.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">그 관객에게서 벗어나, 앞에서 유지하던 말투나 태도를 내려놓을 수 있는 상황이다.</text>
<rect x="88" y="569" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="607.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">운전 상황에 적용</text>
<text x="422" y="607.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">혼자 있을 때보다 동승자가 있을 때 자신의 말과 행동이 어떻게 보일지 더 의식할 수 있다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">적용 해석</text>
<text x="356" y="754.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있으면 운전자는 다른 사람을 의식해 자신의 말과 행동을 조절할 수 있다.</text></svg>