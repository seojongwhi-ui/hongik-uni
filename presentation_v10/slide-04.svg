<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 연구 목적</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">혼자 운전할 때의 감정 조절을 어떻게 도울 수 있을까</text>
<text x="88" y="218.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">동승자가 있을 때 나타나는 감정·행동 조절을 AI로 도울 수 있는지 탐색한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">04</text>
<text x="88" y="325.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">관찰 현상</text>
<text x="422" y="325.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있을 때 운전자가 감정 표현과 행동을 조절하는 현상에 주목한다.</text>
<rect x="88" y="383" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="421.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">연구 질문</text>
<text x="422" y="421.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">혼자 운전할 때도 AI의 도움으로 자신의 감정과 행동을 조절할 수 있을까?</text>
<rect x="88" y="479" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="517.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">설계 가능성</text>
<text x="422" y="517.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">AI의 말이나 반응이 주변 사람의 안전을 생각하는 데 도움이 될 수 있을까?</text>
<rect x="88" y="575" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="613.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">장기 목표</text>
<text x="422" y="613.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">감정 조절과 위험 행동 감소를 검증하고, 이후 사고 예방 가능성을 살펴본다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">설계 방향</text>
<text x="356" y="754.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">운전자가 주변 사람의 안전을 떠올리고 자신의 반응을 조절하도록 돕는 AI를 탐색한다.</text></svg>