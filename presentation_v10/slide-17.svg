<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 개인심리학</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">정서표현갈등: 감정을 드러낼 때의 망설임</text>
<text x="88" y="218.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">윤보영·이순철(2011)은 익명상황의 난폭운전과 감정 표현 성향의 관련성을 조사했다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: 윤보영·이순철(2011), 익명상황의 운전행동과 운전분노 및 정서표현갈등과의 관계</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">17</text>
<text x="88" y="307.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">정서표현갈등</text>
<text x="422" y="307.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">감정을 드러내고 싶지만, 표현해도 괜찮을지 걱정하며 망설이는 상태를 뜻한다.</text>
<rect x="88" y="371" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="409.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">자기방어적 양가성</text>
<text x="422" y="409.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">감정을 표현하고 싶은 마음과 거절당하거나 상처받을까 걱정하는 마음이 함께 있는 성향이다.</text>
<rect x="88" y="473" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="511.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">선행연구 결과</text>
<text x="422" y="511.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">익명상황에서 난폭운전을 많이 보고한 집단은 운전분노와 정서표현갈등, 자기방어적 양가성 수준도 높았다.</text>
<rect x="88" y="575" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="613.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">후속 연구 질문</text>
<text x="422" y="613.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">평소 감정 표현을 어려워하는 정도에 따라, 동승자가 있을 때의 표현·행동 변화도 달라지는가?</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">해석 범위</text>
<text x="356" y="754.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">선행연구는 관련성을 보여준다. 감정을 억누르면 난폭운전을 하게 된다고 단정할 수는 없다.</text></svg>