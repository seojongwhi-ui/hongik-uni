<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">05 · 향후 연구계획</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">설문 결과 이후의 연구 진행 방향</text>
<text x="88" y="218.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">안전 책임감이 작용하는 이유를 보완하고, 본조사와 AI 설계로 이어간다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">19</text>
<text x="88" y="313.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">1. 선행연구 보완</text>
<text x="422" y="313.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인을 돌볼 책임, 분노 조절, 함께 화를 내는 현상, AI를 사회적 상대로 대하는 반응을 검토한다.</text>
<rect x="88" y="379" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="417.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">2. 본조사 설계</text>
<text x="422" y="417.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">표본을 확대하고 책임감, 시선 의식, 분노의 정도, 감정 표현, 운전 행동을 구분해 묻는다.</text>
<rect x="88" y="483" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="521.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">3. 분석 방향</text>
<text x="422" y="521.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자와의 관계와 개인의 감정 표현 성향에 따라, 조절되는 이유와 정도가 다른지 비교한다.</text>
<rect x="88" y="587" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="625.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">4. AI 설계·평가</text>
<text x="422" y="625.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">AI가 안전 책임감을 떠올리게 하는지, 감정·행동 조절에 도움이 되는지, 주의를 방해하는지 평가한다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">현재 단계</text>
<text x="356" y="754.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">예비조사 결과와 선행연구에 근거한 해석을 제시하며, 원인과 AI 효과는 후속 연구에서 검증한다.</text></svg>