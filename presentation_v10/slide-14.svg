<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 선행연구</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자에 따른 변화를 이해하는 세 관점</text>
<text x="88" y="218.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">타인과의 관계, 평가받는다는 의식, 감정 표현 성향을 함께 살펴본다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: Goffman(1959), Cottrell(1972), 윤보영·이순철(2011) · 연구자 해석 포함</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">14</text>
<text x="88" y="321.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01</text>
<text x="88" y="405.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">인문·사회적 관점</text>
<rect x="88" y="478" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="88" y="529.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">Goffman(1959)</text>
<text x="88" y="563.9666666666667" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인에게 어떤 모습으로 보이고 싶은가? 함께</text>
<text x="88" y="598.5" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">있는 사람에 따라 말과 행동을 달리하는</text>
<text x="88" y="633.0333333333333" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">이유를 살펴본다.</text>
<text x="581.3333333333333" y="321.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">02</text>
<text x="581.3333333333333" y="405.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">사회심리학적 관점</text>
<rect x="581.3333333333333" y="478" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="581.3333333333333" y="529.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">Cottrell(1972)</text>
<text x="581.3333333333333" y="563.9666666666667" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">다른 사람이 내 행동을 평가한다고 느끼는가?</text>
<text x="581.3333333333333" y="598.5" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">평가받는다는 의식이 반응을 바꾸는지</text>
<text x="581.3333333333333" y="633.0333333333333" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">살펴본다.</text>
<text x="1074.6666666666665" y="321.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03</text>
<text x="1074.6666666666665" y="405.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">개인심리학적 관점</text>
<rect x="1074.6666666666665" y="478" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="1074.6666666666665" y="529.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">윤보영·이순철(2011)</text>
<text x="1074.6666666666665" y="563.9666666666667" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">감정을 드러내기 어려운 이유는 무엇인가?</text>
<text x="1074.6666666666665" y="598.5" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">감정 표현 성향과 난폭운전의 관련성을</text>
<text x="1074.6666666666665" y="633.0333333333333" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">살펴본다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">해석 방향</text>
<text x="356" y="754.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">세 관점으로 동승자에 따른 변화를 해석하고, 안전 책임감을 설명할 선행연구를 보완한다.</text></svg>