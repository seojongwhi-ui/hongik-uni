<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 연구 배경</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">관찰된 현상에서 출발한 문제의식</text>
<text x="88" y="218.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">혼자 운전할 때와 누군가 함께 탈 때의 감정 표현 차이에 주목했다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">03</text>
<text x="88" y="329.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">운전 중 분노가 발생하는 상황에서도</text>
<text x="88" y="388.8" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있을 때는 감정 표현과 행동이</text>
<text x="88" y="448" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">상대적으로 조절되는 경험이 관찰되었다.</text>
<text x="88" y="577.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">이 변화에는 타인의 시선을 의식하는 마음과</text>
<text x="88" y="611.9666666666667" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">함께 탄 사람의 안전을 지켜야 한다는 책임감이 관련될 수 있다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">문제의식</text>
<text x="356" y="754.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">이러한 변화가 다른 운전자에게도 나타나는지 예비조사를 통해 확인하고자 했다.</text></svg>