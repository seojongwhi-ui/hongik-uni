<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 선행연구 종합</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 행동을 바꾸는 이유를 어떻게 확인할까</text>
<text x="88" y="218.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">선행연구의 설명과 설문의 안전 책임감 응답을 연결해 후속 연구 질문을 정리한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: 선행연구 및 예비조사 결과를 바탕으로 한 연구자 제안 · 검증 전</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">18</text>
<text x="88" y="311.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">비교할 상황</text>
<text x="422" y="311.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">혼자 운전할 때와 동승자가 있을 때, 감정과 행동이 어떻게 달라지는지 비교한다.</text>
<rect x="88" y="372" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="410.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">구분할 두 이유</text>
<text x="422" y="410.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인에게 나쁘게 보이고 싶지 않은 마음과, 함께 탄 사람의 안전을 지키려는 책임감을 구분한다.</text>
<rect x="88" y="471" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="509.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">함께 살필 개인차</text>
<text x="422" y="509.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">평소 감정을 표현할 때 느끼는 갈등이 동승자에 따른 변화와 관련되는지 확인한다.</text>
<rect x="88" y="570" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="608.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">구분할 결과</text>
<text x="422" y="608.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">실제로 느끼는 화의 정도, 말로 표현하는 정도, 위험한 운전 행동을 각각 측정한다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">핵심 가설</text>
<text x="356" y="754.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자의 안전에 대한 책임감이 높을수록 감정 표현과 위험 행동을 더 조절할 것이다.</text></svg>