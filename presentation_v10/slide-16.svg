<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 사회심리학</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">평가 불안: 다른 사람의 판단을 의식하는 마음</text>
<text x="88" y="218.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">Cottrell(1972)은 타인에게 평가받을 수 있다는 예상이 수행에 영향을 준다고 설명했다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: Cottrell, Social Facilitation, 1972; Cottrell et al., 1968 · 운전 적용은 가설</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">16</text>
<text x="88" y="311.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">핵심 개념</text>
<text x="422" y="311.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">평가 불안은 다른 사람이 자신의 행동이나 능력을 어떻게 판단할지 신경 쓰는 마음이다.</text>
<rect x="88" y="372" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="410.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">관련 실험</text>
<text x="422" y="410.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">Cottrell 등(1968)의 과제 실험에서는 관찰하는 관객이 있을 때와 단순히 타인이 있을 때의 반응이 달랐다.</text>
<rect x="88" y="471" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="509.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">운전 상황에 적용</text>
<text x="422" y="509.43333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 운전 태도를 나쁘게 볼까 신경 쓰여 거친 말이나 행동을 줄이는지 확인할 수 있다.</text>
<rect x="88" y="570" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="608.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">설문과의 연결</text>
<text x="422" y="608.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">이번 설문에서는 평가와 관련된 이유보다 안전 책임감이 많이 선택되었다. 두 이유를 구분해 살펴본다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">검토할 점</text>
<text x="356" y="754.4333333333334" font-family="Noto Sans KR" font-size="23.333333333333336" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">평가받는다는 의식이 운전 중 분노 표현을 줄이는지는 별도로 검증해야 한다.</text></svg>