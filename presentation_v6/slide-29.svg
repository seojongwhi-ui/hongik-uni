<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">APPENDIX · 선행연구</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">선행연구 보완 틀 2 / 2</text>
<text x="88" y="219.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">논문을 추가할 때 발표 안에서 맡을 역할을 먼저 정리한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">교수님 피드백용 · 임시 정리 틀</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">29</text>
<text x="88" y="312.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">현상 설명</text>
<text x="422" y="312.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">운전 중 분노가 어떤 상황에서 발생하고 어떤 방식으로 표현되는지 설명</text>
<rect x="88" y="381" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="420.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">조절 기제</text>
<text x="422" y="420.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자의 존재가 왜 표현 억제, 책임감, 감정 재해석으로 이어질 수 있는지 설명</text>
<rect x="88" y="489" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="528.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">관계 해석</text>
<text x="422" y="528.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자의 유형과 관계성이 억제 또는 동조 반응을 어떻게 다르게 만드는지 설명</text>
<rect x="88" y="597" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="636.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">설계 연결</text>
<text x="422" y="636.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">AI가 감시가 아니라 동승자적 존재감과 안전 책임감을 어떻게 환기할지 설명</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">작성 원칙</text>
<text x="356" y="755.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">선행연구는 단순 나열보다 본 연구의 결과 해석과 설계 근거로 배치한다.</text></svg>