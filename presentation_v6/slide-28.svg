<text x="422" y="312.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타자, 책임, 관계, 공간 경험을 통해 동승자를 해석하는 문헌</text>
