<text x="422" y="528.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자 존재, 사회적 규범, 체면, 역할 변화와 운전 행동의 관계 문헌</text>
