<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 발표 구성</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">연구의 전개 순서</text>
<text x="88" y="219.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">관찰된 현상에서 예비조사와 해석, 설계 가능성으로 이어지는 구조다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">02</text>
<text x="88" y="308.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">1. 연구 배경</text>
<text x="422" y="308.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">운전 중 분노 경험과 동승자 존재에 따른 자기조절 경험</text>
<rect x="88" y="368" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="407.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">2. 예비조사</text>
<text x="422" y="407.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">분노 유발 상황, 반응 방식, 동승자 영향과 그 이유 확인</text>
<rect x="88" y="467" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="506.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">3. 결과 해석</text>
<text x="422" y="506.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">시선 의식보다 안전 책임감이 크게 나타난 결과를 인문학적·심리적·사회적으로 설명</text>
<rect x="88" y="566" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="605.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">4. 설계 방향</text>
<text x="422" y="605.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자적 존재감과 책임감 환기를 활용한 차량 AI 인터페이스 가능성</text>
<rect x="88" y="665" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="704.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">5. 피드백 요청</text>
<text x="422" y="704.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">연구 중심축, 선행연구 범위, 본조사와 평가 방식 확정</text></svg>