<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03 · 해석 방향</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">설문 결과를 어떻게 읽을 것인가</text>
<text x="88" y="219.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">이 지점에서 인문학적·심리적·사회적 선행연구가 필요해진다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">13</text>
<text x="88" y="322.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">현상 관찰</text>
<text x="422" y="322.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있을 때 운전자의 감정 표현과 행동이 조절되는 현상에서 출발했다.</text>
<rect x="88" y="379" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="418.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">설문 확인</text>
<text x="422" y="418.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">응답자들도 동승 상황에서 표현과 행동을 조절한다고 응답했다.</text>
<rect x="88" y="475" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="514.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">핵심 발견</text>
<text x="422" y="514.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">그 이유는 시선 의식보다 동승자의 안전 책임감에 가까웠다.</text>
<rect x="88" y="571" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="610.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">해석 필요</text>
<text x="422" y="610.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">왜 타인의 존재가 감정 조절과 책임감으로 이어지는지 설명해야 한다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">발표의 요지</text>
<text x="356" y="755.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">이 연구는 설문 결과를 바탕으로 동승자를 타자, 관계, 책임의 관점에서 해석한다.</text></svg>