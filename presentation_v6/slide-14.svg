<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03 · 이론적 배경</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">선행연구를 채울 세 가지 해석 축</text>
<text x="88" y="219.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">구체적인 논문명은 추후 보완하고, 현재는 결과 해석의 틀을 먼저 설정한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">14</text>
<text x="88" y="310.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">인문학적 측면</text>
<text x="422" y="310.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자를 감시자가 아니라 관계 속의 타자, 보호해야 할 존재로 이해하는 관점</text>
<rect x="88" y="395" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="434.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">심리적 측면</text>
<text x="422" y="434.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">분노 상황의 의미가 피해 경험에서 안전한 도착과 자기조절 과제로 전환되는 과정</text>
<rect x="88" y="519" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="558.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">사회적 측면</text>
<text x="422" y="558.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">차량 내부의 역할 관계, 동승자의 유형, 체면과 책임 규범이 행동에 미치는 영향</text>
<rect x="88" y="643" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="682.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">디자인 측면</text>
<text x="422" y="682.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">이 해석을 차량 내 AI의 존재감, 메시지, 개입 강도, 사용자 수용성으로 연결하는 관점</text></svg>