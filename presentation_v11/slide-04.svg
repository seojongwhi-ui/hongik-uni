<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" />
  <text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 연구 목적</text>
  <text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">혼자 운전할 때의 감정 조절을 어떻게 도울 수 있을까</text>
  <text x="88" y="219.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">동승자 효과를 차량 AI 경험으로 전환할 가능성을 탐색한다.</text>
  <rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2" />
  <rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
  <text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">04</text>
  <text x="88" y="326.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">경험</text>
  <text x="422" y="326.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있으면 분노 표현과 위험한 반응을 줄이게 되는 순간이 있다.</text>
  <rect x="88" y="383" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="422.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">질문</text>
  <text x="422" y="422.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">혼자 운전할 때도 비슷한 감정 조절 경험을 만들 수 있을까?</text>
  <rect x="88" y="479" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="518.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">가능성</text>
  <text x="422" y="518.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">AI가 감시자가 아니라 동승자의 존재감과 책임감을 환기할 수 있을까?</text>
  <rect x="88" y="575" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="614.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">기대</text>
  <text x="422" y="614.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">분노 표현과 위험 행동을 낮춰 사고 예방 가능성을 높일 수 있을까?</text>
  <rect x="88" y="704" width="1424" height="94" fill="#EAF5F4" />
  <text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">설계 방향</text>
  <text x="356" y="755.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">AI는 동승자가 함께 있을 때처럼, 운전자가 스스로 감정과 행동을 조절하도록 돕는다.</text>
</svg>