<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" />
  <text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03 · 설문 인사이트</text>
  <text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">결과값에서 도출한 연구 초점</text>
  <text x="88" y="219.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">예비조사 결과는 동승자 존재와 책임감의 관계를 연구할 필요성을 보여준다.</text>
  <rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2" />
  <rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
  <text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">13</text>
  <text x="88" y="312.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">인사이트 1</text>
  <text x="422" y="312.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">운전 분노는 경적·상향등·손짓처럼 타인의 적대적 표현에서 가장 강하게 나타났다.</text>
  <rect x="88" y="369" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="408.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">인사이트 2</text>
  <text x="422" y="408.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">분노는 보복 행동보다 혼잣말, 욕설 등 차량 내부 표현으로 먼저 나타나는 경향이 있었다.</text>
  <rect x="88" y="465" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="504.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">인사이트 3</text>
  <text x="422" y="504.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있을 때 감정 표현 조절과 행동 억제가 모두 높게 응답되었다.</text>
  <rect x="88" y="561" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="600.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">인사이트 4</text>
  <text x="422" y="600.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">조절 이유는 시선 의식보다 동승자의 안전에 대한 책임감이 가장 크게 나타났다.</text>
  <rect x="88" y="704" width="1424" height="94" fill="#EAF5F4" />
  <text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">연구 초점</text>
  <text x="356" y="755.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자 존재가 책임감과 감정 표현 조절로 이어지는 과정을 연구한다.</text>
</svg>