<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" />
  <text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01 · 조사 이유</text>
  <text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자 효과를 예비조사로 확인했다</text>
  <text x="88" y="219.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">설문은 이론 검증보다 문제 발견과 방향 확인을 위한 예비조사로 진행했다.</text>
  <rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2" />
  <rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
  <text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">05</text>
  <text x="88" y="308.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 1</text>
  <text x="422" y="308.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">운전자들은 운전 중 분노를 경험하는가?</text>
  <rect x="88" y="368" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="407.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 2</text>
  <text x="422" y="407.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">분노는 어떤 상황에서 특히 강하게 나타나는가?</text>
  <rect x="88" y="467" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="506.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 3</text>
  <text x="422" y="506.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">분노가 발생했을 때 어떤 방식으로 반응하는가?</text>
  <rect x="88" y="566" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="605.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 4</text>
  <text x="422" y="605.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자는 분노 표현을 낮추는가, 혹은 감정 동조를 통해 높이는가?</text>
  <rect x="88" y="665" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="704.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">확인 5</text>
  <text x="422" y="704.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">그 변화의 이유가 시선 의식인지, 안전 책임감인지 확인할 수 있는가?</text>
</svg>