<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" />
  <text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 사회심리학</text>
  <text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">평가 불안이론: 타인의 평가를 의식하는 마음</text>
  <text x="88" y="219.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">Cottrell(1972)은 타인의 단순한 존재보다 평가 가능성이 사회적 억제의 핵심이라고 보았다.</text>
  <rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2" />
  <rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: Cottrell, Social Facilitation, 1972; Zajonc, 1965</text>
  <text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">16</text>
  <text x="88" y="312.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">이론적 차별성</text>
  <text x="422" y="312.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">Zajonc(1965)는 타인의 물리적 존재만으로 각성이 발생한다고 보았으나, Cottrell은 평가 가능성이 핵심</text>
  <text x="422" y="347.68" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동인이라고 설명했다.</text>
  <rect x="88" y="372" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="411.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">평가 가능성 인식</text>
  <text x="422" y="411.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인이 나를 볼 수 있고 판단할 수 있다고 느끼면 평가 불안이 발생하고, 사회적 규범을 따르려는 경향이</text>
  <text x="422" y="446.68" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">강화된다.</text>
  <rect x="88" y="471" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="510.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">평가 가능성 약화</text>
  <text x="422" y="510.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">신원이 드러나지 않거나 시선이 차단된 상황에서는 평가 불안이 줄어들고, 행동을 억제하던 사회적 통제도</text>
  <text x="422" y="545.68" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">약해질 수 있다.</text>
  <rect x="88" y="570" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="609.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">연구 적용</text>
  <text x="422" y="609.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">혼자 운전할 때는 평가 가능성이 낮아지고, 동승자가 있을 때는 평가 가능성과 관계적 책임이 함께 활성화될 수</text>
  <text x="422" y="644.68" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">있다.</text>
  <rect x="88" y="704" width="1424" height="94" fill="#EAF5F4" />
  <text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">적용 지점</text>
  <text x="356" y="755.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자의 영향은 타인의 평가를 의식하는 마음과 안전을 지켜야 한다는 책임감으로 살펴볼 수 있다.</text>
</svg>