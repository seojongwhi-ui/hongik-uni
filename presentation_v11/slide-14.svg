<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" />
  <text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 선행연구</text>
  <text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">이론적 배경: 다층적 분석 프레임워크</text>
  <text x="88" y="219.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">단일 관점만으로는 운전 중 분노 조절과 탈억제 행동의 차이를 충분히 설명하기 어렵다.</text>
  <rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2" />
  <rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: Goffman(1959), Cottrell(1972), 윤보영·이순철(2011) 기반 정리</text>
  <text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">14</text>
  <text x="88" y="321.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01</text>
  <text x="88" y="405.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">인문학적 관점</text>
  <rect x="88" y="478" width="437.3333333333333" height="1.5" fill="#DAE1E2" />
  <text x="88" y="530.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">Goffman(1959)의 자아 연출 이론을</text>
  <text x="88" y="565.68" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">바탕으로, 시선이 있는 공간과 시선이</text>
  <text x="88" y="601.1999999999999" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">약화된 공간에서 행동 양식이 달라지는</text>
  <text x="88" y="636.7199999999999" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">구조를 본다.</text>
  <text x="581.3333333333333" y="321.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">02</text>
  <text x="581.3333333333333" y="405.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">사회심리학적 관점</text>
  <rect x="581.3333333333333" y="478" width="437.3333333333333" height="1.5" fill="#DAE1E2" />
  <text x="581.3333333333333" y="530.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">Cottrell(1972)의 평가 불안이론을 통해,</text>
  <text x="581.3333333333333" y="565.68" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인의 존재 자체보다 평가 가능성 인식이</text>
  <text x="581.3333333333333" y="601.1999999999999" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">행동 억제에 영향을 준다는 점을 본다.</text>
  <text x="1074.6666666666665" y="321.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03</text>
  <text x="1074.6666666666665" y="405.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">개인심리학적 관점</text>
  <rect x="1074.6666666666665" y="478" width="437.3333333333333" height="1.5" fill="#DAE1E2" />
  <text x="1074.6666666666665" y="530.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">윤보영·이순철(2011)의 정서표현갈등</text>
  <text x="1074.6666666666665" y="565.68" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">논의를 통해, 억제된 정서와 개인차가 난폭</text>
  <text x="1074.6666666666665" y="601.1999999999999" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">행동으로 이어질 가능성을 본다.</text>
  <rect x="88" y="704" width="1424" height="94" fill="#EAF5F4" />
  <text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">해석 구조</text>
  <text x="356" y="755.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">운전 상황 → 타인의 평가에 대한 의식 → 개인의 심리 특성으로 이어지는 3단계 구조로 살펴본다.</text>
</svg>