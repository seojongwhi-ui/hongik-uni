<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" />
  <text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 인문학</text>
  <text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">자아 연출 이론: 무대와 시선</text>
  <text x="88" y="219.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">Goffman(1959)은 타인과 만날 때의 행동을 관객 앞에서 하는 연기에 비유한다.</text>
  <rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2" />
  <rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: Goffman, The Presentation of Self in Everyday Life, 1959</text>
  <text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">15</text>
  <text x="88" y="320.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">핵심 개념</text>
  <text x="422" y="320.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">인간은 타인의 시선이 있는 곳에서 자신의 인상을 관리하고, 사회적으로 적절한 모습을 연출한다.</text>
  <rect x="88" y="377" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="416.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">전면 영역</text>
  <text x="422" y="416.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인의 시선과 사회적 규범이 있는 공간이다. 타인에게 보여줄 모습을 의식하며 말과 행동을</text>
  <text x="422" y="451.68" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">조절한다.</text>
  <rect x="88" y="473" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="512.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">후면 영역</text>
  <text x="422" y="512.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인의 시선을 덜 의식하는 공간이다. 남에게 보일 모습을 덜 신경 쓰며, 참았던 감정을 드러낼 수 있다.</text>
  <rect x="88" y="569" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="608.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">연구 적용</text>
  <text x="422" y="608.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">차량은 공적인 도로 위에 있지만, 혼자 탄 운전자는 차 안을 타인의 시선을 덜 의식하는 공간으로 느낄 수</text>
  <text x="422" y="643.68" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">있다.</text>
  <rect x="88" y="704" width="1424" height="94" fill="#EAF5F4" />
  <text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">적용 지점</text>
  <text x="356" y="755.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 있으면 운전자는 다른 사람에게 보이는 자신의 모습을 의식해 말과 행동을 조절할 수 있다.</text>
</svg>