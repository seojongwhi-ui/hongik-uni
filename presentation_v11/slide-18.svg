  <text x="951" y="571.8" font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#626D70" text-anchor="middle" letter-spacing="0">윤보영·이순철</text>
  <text x="951" y="601.4" font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#626D70" text-anchor="middle" letter-spacing="0">정서표현갈등(AEQ)</text>
  <text x="1315" y="571.8" font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#626D70" text-anchor="middle" letter-spacing="0">일탈·난폭 행동</text>
  <text x="1315" y="601.4" font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#626D70" text-anchor="middle" letter-spacing="0">감정 표현</text>
  <rect x="88" y="704" width="1424" height="94" fill="#EAF5F4" />
  <text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">학술적 의의</text>
  <text x="356" y="755.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">공간·평가·개인차가 함께 작동하는 운전 분노 조절 모델로 확장한다.</text>
