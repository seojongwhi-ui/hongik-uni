<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF" />
  <text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">04 · 통합 모델</text>
  <text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">선행연구 기반 통합 매개 모델</text>
  <text x="88" y="219.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">운전 상황, 타인의 평가에 대한 의식, 개인의 심리 특성을 연결해 운전 행동의 차이를 설명한다.</text>
  <rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2" />
  <rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2" />
  <text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">출처: Goffman(1959), Cottrell(1972), 윤보영·이순철(2011) 기반 연구자 재구성</text>
  <text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">18</text>
  <text x="223" y="341.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="middle" letter-spacing="0">상황적 조건</text>
  <text x="587" y="341.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="middle" letter-spacing="0">사회적 기제</text>
  <text x="951" y="341.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="middle" letter-spacing="0">개인적 특성</text>
  <text x="1315" y="341.16" font-family="Noto Sans KR" font-size="23.3333333333333" font-weight="700" fill="#087E83" text-anchor="middle" letter-spacing="0">행동적 결과</text>
  <text x="88" y="435.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">익명 상황</text>
  <text x="88" y="494.8" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">후면 영역</text>
  <text x="452" y="435.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">평가 불안</text>
  <text x="452" y="494.8" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">통제 해제</text>
  <text x="816" y="435.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">정서갈등</text>
  <text x="816" y="494.8" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">개인차</text>
  <text x="1180" y="435.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">억제 풀림</text>
  <text x="1180" y="494.8" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">난폭 반응</text>
  <text x="400" y="456.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="middle" letter-spacing="0">→</text>
  <text x="764" y="456.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="middle" letter-spacing="0">→</text>
  <text x="1128" y="456.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="middle" letter-spacing="0">→</text>
  <text x="223" y="571.8" font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#626D70" text-anchor="middle" letter-spacing="0">Goffman</text>
  <text x="223" y="601.4" font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#626D70" text-anchor="middle" letter-spacing="0">후면 영역</text>
  <text x="587" y="571.8" font-family="Noto Sans KR" font-size="20" font-weight="400" fill="#626D70" text-anchor="middle" letter-spacing="0">Cottrell</text>
