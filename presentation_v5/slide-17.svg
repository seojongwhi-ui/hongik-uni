<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>
<text x="88" y="59.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03 · 공간 해석</text>
<text x="88" y="156.4" font-family="Noto Sans KR" font-size="60" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">자동차는 감정과 관계가 함께 놓이는 공간</text>
<text x="88" y="219.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">공적 도로, 사적 실내, 동승자와의 관계라는 세 층위로 이해한다.</text>
<rect x="88" y="253" width="1424" height="1.5" fill="#DAE1E2"/>
<rect x="88" y="826" width="1424" height="1.5" fill="#DAE1E2"/>
<text x="88" y="862.62" font-family="Noto Sans KR" font-size="18" font-weight="400" fill="#626D70" text-anchor="start" letter-spacing="0">연구계획서 초안 · 교수님 피드백용</text>
<text x="1512" y="861.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#626D70" text-anchor="end" letter-spacing="0">17</text>
<text x="88" y="324.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">01</text>
<text x="88" y="408.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">공적 도로</text>
<rect x="88" y="481" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="88" y="533.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">끼어들기, 경적, 상향등 등</text>
<text x="88" y="568.68" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인의 행동과 접촉하며</text>
<text x="88" y="604.1999999999999" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">감정적 충돌을 경험한다.</text>
<text x="581.3333333333333" y="324.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">02</text>
<text x="581.3333333333333" y="408.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">사적 실내</text>
<rect x="581.3333333333333" y="481" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="581.3333333333333" y="533.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">분노가 혼잣말과 욕설 등</text>
<text x="581.3333333333333" y="568.68" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">차량 내부의 표현으로</text>
<text x="581.3333333333333" y="604.1999999999999" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">나타날 수 있다.</text>
<text x="1074.6666666666665" y="324.8" font-family="Noto Sans KR" font-size="20" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">03</text>
<text x="1074.6666666666665" y="408.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">관계적 공간</text>
<rect x="1074.6666666666665" y="481" width="437.3333333333333" height="1.5" fill="#DAE1E2"/>
<text x="1074.6666666666665" y="533.16" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">동승자가 탑승하면</text>
<text x="1074.6666666666665" y="568.68" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">자신의 감정과 함께</text>
<text x="1074.6666666666665" y="604.1999999999999" font-family="Noto Sans KR" font-size="24" font-weight="400" fill="#202628" text-anchor="start" letter-spacing="0">타인의 안전을 고려한다.</text>
<rect x="88" y="704" width="1424" height="94" fill="#EAF5F4"/>
<text x="112" y="764.6" font-family="Noto Sans KR" font-size="40" font-weight="700" fill="#087E83" text-anchor="start" letter-spacing="0">해석의 초점</text>
<text x="356" y="755.16" font-family="Noto Sans KR" font-size="24" font-weight="700" fill="#202628" text-anchor="start" letter-spacing="0">차량 내부를 감정과 책임이 교차하는 생활공간으로 본다.</text></svg>